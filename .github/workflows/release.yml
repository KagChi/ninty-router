name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  BIN: ninty-router

jobs:
  binaries:
    name: binary ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,  os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-x86_64,   os: macos-13,      target: x86_64-apple-darwin }
          - { name: macos-aarch64,  os: macos-latest,  target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release -p cli --features embed-web --target ${{ matrix.target }}
          strip target/${{ matrix.target }}/release/${{ env.BIN }} || true

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/${{ env.BIN }}-${{ matrix.name }}.tar.gz \
            -C target/${{ matrix.target }}/release ${{ env.BIN }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BIN }}-${{ matrix.name }}.tar.gz

  docker:
    name: docker GHCR
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build + push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
